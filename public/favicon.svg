<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1233" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A9" />
      <stop offset="40%" stop-color="#DFB76C" />
      <stop offset="80%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Ícone Estilizado de Nail Polish / Diamante de Beleza Luxo -->
  <g filter="url(#glow)">
    <!-- Tampa / Frasco Dourado Luxo -->
    <rect x="236" y="100" width="40" height="90" rx="10" fill="url(#goldGrad)" />
    <!-- Frasco com Corte Facetado -->
    <path d="M 180 200 L 332 200 L 360 380 C 360 410 330 420 256 420 C 182 420 152 410 152 380 Z" fill="none" stroke="url(#goldGrad)" stroke-width="16" />
    <!-- Brilho Interno Diamante -->
    <path d="M 256 240 L 290 300 L 256 360 L 222 300 Z" fill="url(#goldGrad)" />
    <!-- Estrelas de Brilho / Sparkles -->
    <circle cx="340" cy="180" r="12" fill="#F5E0A9" />
    <circle cx="170" cy="270" r="8" fill="#F5E0A9" />
  </g>
</svg>